# Team lint baseline from team-skills templates/lint. adopt_lint.py copies it.
line-length = 200
required-version = ">=0.17.3"  # The rule set and adopt_lint.py's `ruff: ignore` comments assume this release.
force-exclude = true
show-fixes = true
unsafe-fixes = false

[lint]
select = ["ALL"]  # Every stable rule; preview rules stay off. Upgrades are deliberate because the version is pinned.
ignore = [
    "S",  # Do not run flake8-bandit; its findings are noise outside audited code.
    "D",  # Docstring style is not correctness.
    "CPY",  # No copyright headers.
    "TD",  # TODO comment format is not correctness.
    "FIX",  # TODO comments are allowed.
    "COM812",  # Conflicts with the formatter.
    "ISC001",  # Conflicts with the formatter.
    "E501",  # The formatter owns line length.
    "ASYNC109",  # Allow deliberate timeout parameters in async APIs.
    "TRY003",  # EM already governs exception messages.
    "FBT003",  # Flags positional booleans passed to APIs we do not own.
    "TC001",  # Runtime annotation readers (Pydantic, FastAPI) need real imports.
    "TC002",  # Runtime annotation readers (Pydantic, FastAPI) need real imports.
    "TC003",  # Runtime annotation readers (Pydantic, FastAPI) need real imports.
    "PLR0911",  # C901 already limits complexity.
    "PLR0912",  # C901 already limits complexity.
    "PLR0915",  # C901 already limits complexity.
]

[lint.per-file-ignores]
# Tests may reach into private members, sit outside a package, and compare against literal values.
"**/tests/**" = ["SLF001", "INP001", "PLR2004"]
"**/test_*.py" = ["SLF001", "INP001", "PLR2004"]
"**/conftest.py" = ["SLF001", "INP001", "PLR2004"]

[lint.isort]
split-on-trailing-comma = false  # Do not preserve comma-forced import line breaks.

[lint.mccabe]
max-complexity = 15

[format]
docstring-code-format = true
skip-magic-trailing-comma = true  # Collapse comma-forced multiline constructs when they fit.
